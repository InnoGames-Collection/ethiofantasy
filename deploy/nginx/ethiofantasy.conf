# ==============================================================================
# Host Nginx Configuration for EthioFantasy
# Target: GCP Compute Engine VM (innoserver-serv001: 34.41.116.217)
# Domain: innopulseplatform.com
# Upstreams:
#   - ethiofantasy_web: 127.0.0.1:3400 (Player Mobile Web Client)
#   - ethiofantasy_api: 127.0.0.1:3402 (Fastify Authoritative API)
#   - ethiofantasy_admin: 127.0.0.1:3403 (Telecom Operations & Auditor Console)
# ==============================================================================

upstream ethiofantasy_web {
    server 127.0.0.1:3400;
    keepalive 32;
}

upstream ethiofantasy_api {
    server 127.0.0.1:3402;
    keepalive 32;
}

upstream ethiofantasy_admin {
    server 127.0.0.1:3403;
    keepalive 16;
}

# 1. Player Client: ethiofantasy.innopulseplatform.com
server {
    listen 80;
    server_name ethiofantasy.innopulseplatform.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ethiofantasy.innopulseplatform.com;

    ssl_certificate /etc/letsencrypt/live/innopulseplatform.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/innopulseplatform.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://ethiofantasy_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. API Subdomain: ethiofantasy-api.innopulseplatform.com
server {
    listen 80;
    server_name ethiofantasy-api.innopulseplatform.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ethiofantasy-api.innopulseplatform.com;

    ssl_certificate /etc/letsencrypt/live/innopulseplatform.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/innopulseplatform.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://ethiofantasy_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. Dedicated Admin Console: ethiofantasy-admin.innopulseplatform.com
server {
    listen 80;
    server_name ethiofantasy-admin.innopulseplatform.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ethiofantasy-admin.innopulseplatform.com;

    ssl_certificate /etc/letsencrypt/live/innopulseplatform.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/innopulseplatform.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://ethiofantasy_admin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
