<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 320" width="100%" height="100%">
  <defs>
    <linearGradient id="ethioGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#80f205" />
      <stop offset="25%" stop-color="#6bd700" />
      <stop offset="75%" stop-color="#4db800" />
      <stop offset="100%" stop-color="#369600" />
    </linearGradient>
    <linearGradient id="dpadGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#026d24" />
      <stop offset="100%" stop-color="#014f19" />
    </linearGradient>
  </defs>

  <!-- LETTER E -->
  <path d="M 40 45 L 140 45 C 160 45 168 53 168 73 L 168 85 C 168 97 160 105 145 105 L 105 105 L 105 118 L 138 118 C 153 118 160 126 160 138 L 160 148 C 160 160 153 168 138 168 L 105 168 L 105 181 L 145 181 C 160 181 168 189 168 201 L 168 213 C 168 233 160 241 140 241 L 40 241 Z" fill="url(#ethioGreen)" />

  <!-- LETTER T -->
  <path d="M 178 45 L 298 45 C 308 45 312 50 312 60 L 312 90 C 312 100 306 105 296 105 L 265 105 L 265 241 L 211 241 L 211 105 L 180 105 C 170 105 164 100 164 90 L 164 60 C 164 50 168 45 178 45 Z" fill="url(#ethioGreen)" />

  <!-- LETTER H -->
  <path d="M 312 45 L 366 45 L 366 118 L 414 118 L 414 45 L 468 45 L 468 241 L 414 241 L 414 168 L 366 168 L 366 241 L 312 241 Z" fill="url(#ethioGreen)" />

  <!-- LETTER I -->
  <path d="M 478 45 L 532 45 L 532 241 L 478 241 Z" fill="url(#ethioGreen)" />

  <!-- LETTER O WITH SOCCER BALL INSIDE -->
  <!-- Rounded Rect container for O -->
  <rect x="542" y="45" width="160" height="196" rx="42" ry="42" fill="url(#ethioGreen)" />
  <rect x="580" y="80" width="84" height="126" rx="28" ry="28" fill="#ffffff" />
  
  <!-- Soccer Ball & Speed Lines -->
  <g transform="translate(628, 143)">
    <!-- Speed motion streaks behind ball -->
    <path d="M -60 -28 L -20 -15 L -20 -5 L -55 -20 Z" fill="#ffffff" opacity="0.9" />
    <path d="M -65 0 L -18 0 L -18 8 L -60 5 Z" fill="#ffffff" opacity="0.9" />
    <path d="M -58 26 L -20 15 L -20 8 L -52 18 Z" fill="#ffffff" opacity="0.9" />

    <!-- Ball Base (White circle with green border) -->
    <circle cx="2" cy="0" r="38" fill="#ffffff" stroke="url(#ethioGreen)" stroke-width="4" />
    
    <!-- Central Pentagram / Polygon pattern (Green) -->
    <polygon points="2,-13 14,-4 9,11 -5,11 -10,-4" fill="url(#ethioGreen)" />
    
    <!-- Outer line connections -->
    <line x1="2" y1="-13" x2="2" y2="-38" stroke="url(#ethioGreen)" stroke-width="3" />
    <line x1="14" y1="-4" x2="35" y2="-12" stroke="url(#ethioGreen)" stroke-width="3" />
    <line x1="9" y1="11" x2="26" y2="28" stroke="url(#ethioGreen)" stroke-width="3" />
    <line x1="-5" y1="11" x2="-22" y2="28" stroke="url(#ethioGreen)" stroke-width="3" />
    <line x1="-10" y1="-4" x2="-31" y2="-12" stroke="url(#ethioGreen)" stroke-width="3" />
    
    <!-- Outer patch segments -->
    <path d="M 2 -38 C 14 -38 25 -32 32 -22 L 23 -17 L 14 -28 Z" fill="url(#ethioGreen)" />
    <path d="M 38 0 C 38 12 33 23 24 30 L 18 20 L 28 10 Z" fill="url(#ethioGreen)" />
    <path d="M 0 38 C -12 38 -23 33 -30 24 L -20 18 L -10 28 Z" fill="url(#ethioGreen)" />
    <path d="M -38 0 C -38 -12 -33 -23 -24 -30 L -18 -20 L -28 -10 Z" fill="url(#ethioGreen)" />
  </g>

  <!-- GAMEPAD ICON CONTAINER [+] -->
  <!-- Outer border -->
  <rect x="714" y="55" width="220" height="176" rx="38" ry="38" fill="none" stroke="url(#ethioGreen)" stroke-width="19" />
  
  <!-- D-PAD [+] on left -->
  <g transform="translate(775, 143)">
    <!-- Vertical bar -->
    <rect x="-14" y="-38" width="28" height="76" rx="6" ry="6" fill="url(#dpadGreen)" />
    <!-- Horizontal bar -->
    <rect x="-38" y="-14" width="76" height="28" rx="6" ry="6" fill="url(#dpadGreen)" />
  </g>

  <!-- ACTION BUTTONS on right (Diamond 4-buttons) -->
  <g transform="translate(870, 143)">
    <!-- Top (Green) -->
    <circle cx="0" cy="-24" r="13" fill="#4db800" />
    <!-- Left (Green) -->
    <circle cx="-24" cy="0" r="13" fill="#4db800" />
    <!-- Bottom (Green) -->
    <circle cx="0" cy="24" r="13" fill="#4db800" />
    <!-- Right (Gold/Orange Yellow) -->
    <circle cx="24" cy="0" r="13" fill="#e5aa00" />
  </g>

  <!-- FANTASY ITALIC TEXT (Bold Dynamic Black) -->
  <g transform="translate(475, 305) skewX(-14)">
    <text
      x="0"
      y="0"
      font-family="'Arial Black', 'Impact', 'Plus Jakarta Sans', sans-serif"
      font-weight="900"
      font-style="italic"
      font-size="82"
      letter-spacing="5"
      fill="#0d0d0d"
      text-anchor="middle"
    >
      FANTASY
    </text>
  </g>
</svg>
